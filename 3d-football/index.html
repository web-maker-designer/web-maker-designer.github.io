<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Football — Web Maker Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;}
#c{display:block;width:100vw;height:100vh;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;}
.hud-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:linear-gradient(180deg,rgba(0,0,0,0.85),transparent);}
.hud-team{display:flex;align-items:center;gap:12px;}
.team-name{font-size:0.85rem;letter-spacing:0.15em;color:#e0e0f0;text-transform:uppercase;}
.score-box{display:flex;align-items:center;gap:0;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.1);}
.score-num{font-size:2rem;font-weight:900;padding:4px 20px;color:#fff;line-height:1;}
.score-sep{color:rgba(255,255,255,0.3);font-size:1.2rem;padding:0 4px;}
.team-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.badge-home{background:linear-gradient(135deg,#1a6aa8,#2980b9);}
.badge-away{background:linear-gradient(135deg,#c0392b,#e74c3c);}
.hud-center{text-align:center;}
.match-time{font-size:1.1rem;color:#00ffe0;letter-spacing:0.2em;}
.match-label{font-size:0.6rem;color:rgba(255,255,255,0.4);letter-spacing:0.2em;margin-top:2px;}

/* MINI MAP */
#minimap{position:fixed;bottom:20px;right:20px;width:120px;height:80px;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,224,0.3);border-radius:2px;z-index:10;}
#minimap canvas{width:100%;height:100%;}

/* CONTROLS */
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;}
.ctrl-row{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
.key{width:36px;height:36px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:rgba(255,255,255,0.6);letter-spacing:0.05em;}
.key.wide{width:80px;}
.key.active{border-color:#00ffe0;color:#00ffe0;background:rgba(0,255,224,0.08);}

/* POWER BAR */
#powerbar{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);width:200px;z-index:10;display:none;}
.pb-label{font-size:0.62rem;color:#00ffe0;letter-spacing:0.15em;text-align:center;margin-bottom:4px;}
.pb-track{width:100%;height:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;}
.pb-fill{height:100%;width:0%;background:linear-gradient(90deg,#00ff88,#ffd84d,#ff2d6b);transition:width 0.05s linear;border-radius:4px;}

/* GOAL SCREEN */
#goalScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none;}
.goal-text{font-size:6rem;font-weight:900;color:#fff;text-shadow:0 0 40px #ffd84d,0 0 80px #ffd84d;letter-spacing:0.1em;animation:goalPop 0.5s ease-out;}
@keyframes goalPop{from{transform:scale(0.3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}

/* MENU */
#menu{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:30;flex-direction:column;gap:0;}
.menu-box{background:#0f0f1a;border:1px solid #1e1e38;width:380px;overflow:hidden;}
.menu-top{padding:28px 28px 20px;border-bottom:1px solid #1e1e38;text-align:center;}
.menu-top h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:0.05em;margin-bottom:4px;}
.menu-top h1 span{color:#00ffe0;}
.menu-top p{color:#5a5a7a;font-size:0.78rem;letter-spacing:0.1em;}
.menu-body{padding:24px 28px;}
.menu-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.menu-row label{font-size:0.72rem;color:#8888aa;letter-spacing:0.12em;text-transform:uppercase;}
.menu-select{background:#12121f;border:1px solid #1e1e38;color:#e0e0f0;padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:0.78rem;outline:none;flex:1;margin-left:16px;}
.menu-select:focus{border-color:#00ffe0;}
.menu-start{width:100%;padding:14px;background:#00ffe0;color:#0a0a0f;font-family:'Share Tech Mono',monospace;font-size:0.88rem;font-weight:700;letter-spacing:0.15em;border:none;cursor:pointer;margin-top:8px;transition:background 0.2s;}
.menu-start:hover{background:#00ccb4;}
.menu-diff{display:flex;gap:0;}
.diff-btn{flex:1;padding:8px;background:#12121f;border:1px solid #1e1e38;color:#5a5a7a;font-family:'Share Tech Mono',monospace;font-size:0.68rem;cursor:pointer;transition:all 0.2s;letter-spacing:0.08em;}
.diff-btn:hover{color:#e0e0f0;}
.diff-btn.active{background:rgba(0,255,224,0.08);border-color:#00ffe0;color:#00ffe0;}

/* PAUSE */
#pauseScreen{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;gap:16px;}
#pauseScreen h2{color:#fff;font-size:2rem;letter-spacing:0.15em;}
.pause-btn{padding:12px 32px;background:transparent;border:1px solid #00ffe0;color:#00ffe0;font-family:'Share Tech Mono',monospace;font-size:0.82rem;cursor:pointer;letter-spacing:0.12em;transition:all 0.2s;}
.pause-btn:hover{background:rgba(0,255,224,0.1);}

/* FULL TIME */
#ftScreen{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:30;flex-direction:column;}
.ft-box{background:#0f0f1a;border:1px solid #1e1e38;padding:40px 60px;text-align:center;}
.ft-box h2{font-size:1rem;color:#5a5a7a;letter-spacing:0.3em;margin-bottom:16px;}
.ft-score{font-size:4rem;font-weight:900;color:#fff;margin-bottom:8px;}
.ft-teams{font-size:0.78rem;color:#5a5a7a;letter-spacing:0.15em;margin-bottom:28px;}
.ft-result{font-size:1.4rem;font-weight:700;margin-bottom:24px;}
.ft-result.win{color:#00ff88;}
.ft-result.loss{color:#ff2d6b;}
.ft-result.draw{color:#ffd84d;}
.ft-btn{padding:12px 32px;background:#00ffe0;color:#0a0a0f;font-family:'Share Tech Mono',monospace;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;letter-spacing:0.12em;margin:0 6px;}

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-bar">
    <div class="hud-team">
      <div class="team-badge badge-home">🔵</div>
      <div class="team-name" id="homeName">Home</div>
    </div>
    <div class="score-box">
      <div class="score-num" id="scoreHome">0</div>
      <div class="score-sep">:</div>
      <div class="score-num" id="scoreAway">0</div>
    </div>
    <div class="hud-center">
      <div class="match-time" id="matchTime">00:00</div>
      <div class="match-label">KICK OFF</div>
    </div>
    <div class="score-box" style="opacity:0"><div class="score-num">0</div><div class="score-sep">:</div><div class="score-num">0</div></div>
    <div class="hud-team" style="flex-direction:row-reverse">
      <div class="team-badge badge-away">🔴</div>
      <div class="team-name" id="awayName">Away</div>
    </div>
  </div>
</div>

<!-- POWER BAR -->
<div id="powerbar">
  <div class="pb-label">SHOT POWER</div>
  <div class="pb-track"><div class="pb-fill" id="pbFill"></div></div>
</div>

<!-- CONTROLS HINT -->
<div id="controls">
  <div class="ctrl-row">
    <div class="key" id="kw">W</div>
  </div>
  <div class="ctrl-row">
    <div class="key" id="ka">A</div>
    <div class="key" id="ks">S</div>
    <div class="key" id="kd">D</div>
  </div>
  <div class="ctrl-row">
    <div class="key wide" id="ksp">SPACE — Shoot</div>
  </div>
</div>

<!-- GOAL SCREEN -->
<div id="goalScreen" style="display:none">
  <div class="goal-text">⚽ GOAL!</div>
</div>

<!-- MENU -->
<div id="menu">
  <div class="menu-box">
    <div class="menu-top">
      <h1>3D <span>Football</span></h1>
      <p>SCORE MORE THAN THE AI TO WIN</p>
    </div>
    <div class="menu-body">
      <div class="menu-row">
        <label>Your Team</label>
        <select class="menu-select" id="menuHome">
          <option>Man City</option><option>Arsenal</option><option>Liverpool</option>
          <option>Chelsea</option><option>Real Madrid</option><option>Barcelona</option>
          <option>Bayern Munich</option><option>PSG</option><option>Inter Milan</option>
          <option>Juventus</option>
        </select>
      </div>
      <div class="menu-row">
        <label>Opponent</label>
        <select class="menu-select" id="menuAway">
          <option>Man Utd</option><option>Tottenham</option><option>Newcastle</option>
          <option>Atletico</option><option>Dortmund</option><option>AC Milan</option>
          <option>Porto</option><option>Ajax</option><option>Roma</option><option>Sevilla</option>
        </select>
      </div>
      <div class="menu-row">
        <label>Duration</label>
        <select class="menu-select" id="menuTime">
          <option value="120">2 min</option>
          <option value="180">3 min</option>
          <option value="300" selected>5 min</option>
        </select>
      </div>
      <div class="menu-row">
        <label>Difficulty</label>
        <div class="menu-diff" style="flex:1;margin-left:16px">
          <button class="diff-btn active" onclick="setDiff('easy',this)">Easy</button>
          <button class="diff-btn" onclick="setDiff('medium',this)">Med</button>
          <button class="diff-btn" onclick="setDiff('hard',this)">Hard</button>
        </div>
      </div>
      <button class="menu-start" onclick="startGame()">KICK OFF →</button>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div id="pauseScreen">
  <h2>PAUSED</h2>
  <button class="pause-btn" onclick="togglePause()">Resume</button>
  <button class="pause-btn" onclick="returnMenu()">Main Menu</button>
</div>

<!-- FULL TIME -->
<div id="ftScreen">
  <div class="ft-box">
    <h2>FULL TIME</h2>
    <div class="ft-score" id="ftScore">0 : 0</div>
    <div class="ft-teams" id="ftTeams"></div>
    <div class="ft-result" id="ftResult"></div>
    <button class="ft-btn" onclick="startGame()">REMATCH</button>
    <button class="ft-btn" style="background:transparent;border:1px solid #00ffe0;color:#00ffe0;" onclick="returnMenu()">MENU</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════
let scene, camera, renderer, clock;
let ball, player, aiPlayer, field;
let goalposts = { home: null, away: null };
let scoreHome = 0, scoreAway = 0;
let matchDuration = 300, timeLeft = 300;
let running = false, paused = false;
let difficulty = 'easy';
let homeName = 'Home', awayName = 'Away';
let keys = {};
let power = 0, charging = false;
let goalCooldown = 0;
let aiTarget = null, aiShootTimer = 0;
let particles = [];
let animId;

// Physics
const BALL_FRICTION  = 0.985;
const BALL_BOUNCEY   = 0.45;
const FIELD_W        = 40;
const FIELD_H        = 60;
const GOAL_W         = 7.32;
const GOAL_H         = 2.44;
const PLAYER_SPEED   = { easy: 0.18, medium: 0.22, hard: 0.28 };
const AI_SPEED       = { easy: 0.10, medium: 0.16, hard: 0.22 };
const AI_SHOOT_RANGE = { easy: 12,   medium: 16,   hard: 20 };

let ballVel = { x: 0, y: 0, z: 0 };
let ballOnGround = true;

// ═══════════════════════════════════════
//  INIT THREE.JS
// ═══════════════════════════════════════
function initThree() {
  scene    = new THREE.Scene();
  scene.fog = new THREE.Fog(0x001100, 40, 120);

  camera   = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 18, 28);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x001100);

  clock = new THREE.Clock();

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(10, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.1;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);

  // Floodlights
  [[-18, 20, -28], [18, 20, -28], [-18, 20, 28], [18, 20, 28]].forEach(([x,y,z]) => {
    const fl = new THREE.PointLight(0xfff8e1, 0.6, 80);
    fl.position.set(x, y, z);
    scene.add(fl);
    // Pole
    const poleG = new THREE.CylinderGeometry(0.15, 0.15, y, 8);
    const poleM = new THREE.MeshLambertMaterial({ color: 0x888888 });
    const pole  = new THREE.Mesh(poleG, poleM);
    pole.position.set(x, y/2, z);
    scene.add(pole);
  });

  buildField();
  buildGoalposts();
  buildPlayers();
  buildBall();
  buildStadium();

  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); startCharge(); }
    if (e.code === 'Escape') togglePause();
    updateKeyHints();
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space') { releaseShoot(); }
    updateKeyHints();
  });
}

// ═══════════════════════════════════════
//  BUILD SCENE
// ═══════════════════════════════════════
function buildField() {
  // Grass
  const grassG = new THREE.PlaneGeometry(FIELD_W, FIELD_H);
  const grassM = new THREE.MeshLambertMaterial({ color: 0x2d8a2d });
  const grass  = new THREE.Mesh(grassG, grassM);
  grass.rotation.x = -Math.PI / 2;
  grass.receiveShadow = true;
  scene.add(grass);

  // Stripe pattern
  for (let i = -4; i <= 4; i++) {
    if (i % 2 === 0) {
      const stripeG = new THREE.PlaneGeometry(FIELD_W, 6.6);
      const stripeM = new THREE.MeshLambertMaterial({ color: 0x267a26, transparent: true, opacity: 0.5 });
      const stripe  = new THREE.Mesh(stripeG, stripeM);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.01, i * 6.6);
      scene.add(stripe);
    }
  }

  // Centre circle
  const circleG = new THREE.RingGeometry(4.9, 5.1, 64);
  const lineM   = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const circle  = new THREE.Mesh(circleG, lineM);
  circle.rotation.x = -Math.PI / 2;
  circle.position.y = 0.02;
  scene.add(circle);

  // Centre line
  const clG = new THREE.PlaneGeometry(FIELD_W, 0.12);
  const cl  = new THREE.Mesh(clG, lineM);
  cl.rotation.x = -Math.PI / 2;
  cl.position.y = 0.02;
  scene.add(cl);

  // Centre dot
  const cdG = new THREE.CircleGeometry(0.2, 16);
  const cd  = new THREE.Mesh(cdG, lineM);
  cd.rotation.x = -Math.PI / 2;
  cd.position.y = 0.02;
  scene.add(cd);

  // Penalty areas
  [-1, 1].forEach(side => {
    const paG = new THREE.EdgesGeometry(new THREE.BoxGeometry(16.5, 0.1, 16.5));
    const paMat = new THREE.LineBasicMaterial({ color: 0xffffff });
    const pa  = new THREE.LineSegments(paG, paMat);
    pa.position.set(0, 0.02, side * (FIELD_H / 2 - 8.25));
    scene.add(pa);
  });

  // Boundary
  const boundG = new THREE.EdgesGeometry(new THREE.BoxGeometry(FIELD_W, 0.05, FIELD_H));
  const boundM = new THREE.LineBasicMaterial({ color: 0xffffff });
  const bound  = new THREE.LineSegments(boundG, boundM);
  bound.position.y = 0.02;
  scene.add(bound);
}

function buildGoalposts() {
  const postM = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const netM  = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, side: THREE.DoubleSide, wireframe: true });

  [-1, 1].forEach(side => {
    const zPos = side * (FIELD_H / 2);
    const group = new THREE.Group();

    // Posts
    [[GOAL_W/2, 0], [-GOAL_W/2, 0]].forEach(([x]) => {
      const pg = new THREE.CylinderGeometry(0.06, 0.06, GOAL_H, 8);
      const p  = new THREE.Mesh(pg, postM);
      p.position.set(x, GOAL_H/2, 0);
      p.castShadow = true;
      group.add(p);
    });

    // Crossbar
    const cbG = new THREE.CylinderGeometry(0.06, 0.06, GOAL_W + 0.12, 8);
    const cb  = new THREE.Mesh(cbG, postM);
    cb.rotation.z = Math.PI / 2;
    cb.position.set(0, GOAL_H, 0);
    group.add(cb);

    // Net
    const netG = new THREE.BoxGeometry(GOAL_W, GOAL_H, 2);
    const net  = new THREE.Mesh(netG, netM);
    net.position.set(0, GOAL_H/2, -side * 1);
    group.add(net);

    group.position.set(0, 0, zPos);
    if (side === -1) goalposts.away = group;
    else             goalposts.home = group;
    scene.add(group);
  });
}

function buildPlayers() {
  // Player (home — blue)
  const bodyG = new THREE.CylinderGeometry(0.35, 0.35, 1.4, 12);
  const headG = new THREE.SphereGeometry(0.28, 12, 12);
  const homeM = new THREE.MeshLambertMaterial({ color: 0x1a6aa8 });
  const skinM = new THREE.MeshLambertMaterial({ color: 0xffcc99 });

  player = new THREE.Group();
  const body = new THREE.Mesh(bodyG, homeM);
  body.position.y = 0.7;
  body.castShadow = true;
  const head = new THREE.Mesh(headG, skinM);
  head.position.y = 1.6;
  head.castShadow = true;
  player.add(body, head);
  player.position.set(0, 0, 10);
  scene.add(player);

  // AI player (away — red)
  const awayM = new THREE.MeshLambertMaterial({ color: 0xc0392b });
  aiPlayer = new THREE.Group();
  const abody = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 12), awayM);
  abody.position.y = 0.7;
  abody.castShadow = true;
  const ahead = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), skinM);
  ahead.position.y = 1.6;
  ahead.castShadow = true;
  aiPlayer.add(abody, ahead);
  aiPlayer.position.set(0, 0, -10);
  scene.add(aiPlayer);
}

function buildBall() {
  const ballG = new THREE.SphereGeometry(0.35, 16, 16);
  const ballM = new THREE.MeshLambertMaterial({ color: 0xffffff });
  ball = new THREE.Mesh(ballG, ballM);
  ball.castShadow = true;
  ball.receiveShadow = true;
  scene.add(ball);

  // Ball shadow
  const shadowG = new THREE.CircleGeometry(0.35, 16);
  const shadowM = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 });
  const shadow  = new THREE.Mesh(shadowG, shadowM);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  ball.userData.shadow = shadow;
  scene.add(shadow);
}

function buildStadium() {
  // Stands (4 sides)
  const standM = new THREE.MeshLambertMaterial({ color: 0x333355 });
  [
    { pos: [0,  3, -36], rot: [0.3,  0,    0],    size: [FIELD_W + 8, 6, 3] },
    { pos: [0,  3,  36], rot: [-0.3, 0,    0],    size: [FIELD_W + 8, 6, 3] },
    { pos: [-25, 3,  0], rot: [0,    0.3,  0],    size: [3, 6, FIELD_H + 8] },
    { pos: [ 25, 3,  0], rot: [0,   -0.3,  0],    size: [3, 6, FIELD_H + 8] },
  ].forEach(({ pos, rot, size }) => {
    const g = new THREE.BoxGeometry(...size);
    const m = new THREE.Mesh(g, standM);
    m.position.set(...pos);
    m.rotation.set(...rot);
    scene.add(m);
  });

  // Sky
  const skyG = new THREE.SphereGeometry(100, 32, 32);
  const skyM = new THREE.MeshBasicMaterial({ color: 0x0a1a0a, side: THREE.BackSide });
  scene.add(new THREE.Mesh(skyG, skyM));
}

// ═══════════════════════════════════════
//  GAME LOGIC
// ═══════════════════════════════════════
function resetPositions() {
  ball.position.set(0, 0.35, 0);
  ballVel = { x: 0, y: 0, z: 0 };
  player.position.set(0, 0, 10);
  aiPlayer.position.set(0, 0, -10);
}

function startCharge() {
  if (!running || paused || goalCooldown > 0) return;
  charging = true;
  power = 0;
  document.getElementById('powerbar').style.display = 'block';
}

function releaseShoot() {
  if (!charging) return;
  charging = false;
  document.getElementById('powerbar').style.display = 'none';

  const dx = ball.position.x - player.position.x;
  const dz = ball.position.z - player.position.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if (dist > 3) return;

  const force = 0.3 + power * 0.5;
  const dirX  = dx / (dist || 1);
  const dirZ  = dz / (dist || 1);

  // Aim toward away goal
  const toGoalZ = goalposts.away.position.z - ball.position.z;
  const blendZ  = (dirZ * 0.3 + Math.sign(toGoalZ) * 0.7);

  ballVel.x = dirX * force * 0.4;
  ballVel.z = blendZ * force;
  ballVel.y = force * 0.35;
  ballOnGround = false;
}

function updatePlayer(dt) {
  const spd = PLAYER_SPEED[difficulty];
  let moved = false;

  if (keys['KeyW'] || keys['ArrowUp'])    { player.position.z -= spd; moved = true; }
  if (keys['KeyS'] || keys['ArrowDown'])  { player.position.z += spd; moved = true; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { player.position.x -= spd; moved = true; }
  if (keys['KeyD'] || keys['ArrowRight']) { player.position.x += spd; moved = true; }

  // Clamp to field
  player.position.x = Math.max(-FIELD_W/2 + 0.5, Math.min(FIELD_W/2 - 0.5, player.position.x));
  player.position.z = Math.max(-FIELD_H/2 + 0.5, Math.min(FIELD_H/2 - 0.5, player.position.z));

  // Face movement direction
  if (moved) {
    const angle = Math.atan2(
      keys['KeyD'] - keys['KeyA'],
      keys['KeyS'] - keys['KeyW']
    );
    player.rotation.y = angle;
  }

  // Kick ball if close
  const dx = ball.position.x - player.position.x;
  const dz = ball.position.z - player.position.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if (dist < 0.9 && !charging) {
    ballVel.x += dx / dist * 0.12;
    ballVel.z += dz / dist * 0.12;
    if (ballOnGround) ballVel.y = 0.04;
  }
}

function updateAI(dt) {
  if (!running || paused) return;

  const spd    = AI_SPEED[difficulty];
  const shootR = AI_SHOOT_RANGE[difficulty];
  const bx     = ball.position.x;
  const bz     = ball.position.z;

  // Simple state: chase ball, then shoot at home goal
  const dx    = bx - aiPlayer.position.x;
  const dz    = bz - aiPlayer.position.z;
  const dist  = Math.sqrt(dx*dx + dz*dz);

  if (dist > 1.2) {
    aiPlayer.position.x += (dx / dist) * spd;
    aiPlayer.position.z += (dz / dist) * spd;
    aiPlayer.rotation.y  = Math.atan2(dx, dz);
  }

  // Kick ball
  if (dist < 1.0) {
    const toGoalX = goalposts.home.position.x - bx + (Math.random() - 0.5) * (difficulty === 'easy' ? 4 : difficulty === 'medium' ? 2 : 0.5);
    const toGoalZ = goalposts.home.position.z - bz;
    const toGoalD = Math.sqrt(toGoalX*toGoalX + toGoalZ*toGoalZ);

    aiShootTimer -= dt;
    if (aiShootTimer <= 0) {
      const force = 0.18 + Math.random() * 0.12;
      ballVel.x = (toGoalX / toGoalD) * force;
      ballVel.z = (toGoalZ / toGoalD) * force;
      ballVel.y = 0.1;
      ballOnGround = false;
      aiShootTimer = 0.8 + Math.random() * 0.4;
    }
  }

  aiPlayer.position.x = Math.max(-FIELD_W/2 + 0.5, Math.min(FIELD_W/2 - 0.5, aiPlayer.position.x));
  aiPlayer.position.z = Math.max(-FIELD_H/2 + 0.5, Math.min(FIELD_H/2 - 0.5, aiPlayer.position.z));
}

function updateBall(dt) {
  // Charging
  if (charging) {
    power = Math.min(1, power + dt * 0.9);
    document.getElementById('pbFill').style.width = (power * 100) + '%';
  }

  // Apply velocity
  ball.position.x += ballVel.x;
  ball.position.y += ballVel.y;
  ball.position.z += ballVel.z;

  // Gravity
  ballVel.y -= 0.018;

  // Friction
  ballVel.x *= BALL_FRICTION;
  ballVel.z *= BALL_FRICTION;

  // Ground
  if (ball.position.y <= 0.35) {
    ball.position.y = 0.35;
    ballVel.y = -ballVel.y * BALL_BOUNCEY;
    if (Math.abs(ballVel.y) < 0.02) { ballVel.y = 0; ballOnGround = true; }
    ballVel.x *= 0.88;
    ballVel.z *= 0.88;
  } else {
    ballOnGround = false;
  }

  // Wall bounces
  if (Math.abs(ball.position.x) > FIELD_W/2 - 0.35) {
    ball.position.x = Math.sign(ball.position.x) * (FIELD_W/2 - 0.35);
    ballVel.x *= -0.6;
  }
  if (ball.position.z > FIELD_H/2 - 0.35 || ball.position.z < -FIELD_H/2 + 0.35) {
    // Only bounce if not in goal mouth
    if (Math.abs(ball.position.x) > GOAL_W/2) {
      ball.position.z = Math.sign(ball.position.z) * (FIELD_H/2 - 0.35);
      ballVel.z *= -0.6;
    }
  }

  // Spin
  const speed = Math.sqrt(ballVel.x**2 + ballVel.z**2);
  ball.rotation.x += ballVel.z * 2;
  ball.rotation.z -= ballVel.x * 2;

  // Shadow follows ball
  if (ball.userData.shadow) {
    ball.userData.shadow.position.x = ball.position.x;
    ball.userData.shadow.position.z = ball.position.z;
    const shadowScale = Math.max(0.3, 1 - ball.position.y * 0.04);
    ball.userData.shadow.scale.set(shadowScale, shadowScale, 1);
    ball.userData.shadow.material.opacity = Math.max(0, 0.4 - ball.position.y * 0.02);
  }

  checkGoal();
}

function checkGoal() {
  if (goalCooldown > 0) { goalCooldown--; return; }

  const bx = ball.position.x;
  const by = ball.position.y;
  const bz = ball.position.z;

  // Away goal (player shoots toward -Z)
  if (bz < -FIELD_H/2 + 0.5 && Math.abs(bx) < GOAL_W/2 && by < GOAL_H + 0.35) {
    scoreHome++;
    document.getElementById('scoreHome').textContent = scoreHome;
    showGoal();
    spawnParticles(0, 1, -FIELD_H/2, 0x00ffe0);
    setTimeout(resetPositions, 2000);
    goalCooldown = 120;
  }

  // Home goal (AI shoots toward +Z)
  if (bz > FIELD_H/2 - 0.5 && Math.abs(bx) < GOAL_W/2 && by < GOAL_H + 0.35) {
    scoreAway++;
    document.getElementById('scoreAway').textContent = scoreAway;
    showGoal('⚽ OPPONENT SCORES!', '#ff2d6b');
    spawnParticles(0, 1, FIELD_H/2, 0xff2d6b);
    setTimeout(resetPositions, 2000);
    goalCooldown = 120;
  }
}

function showGoal(text = '⚽ GOAL!', color = '#ffd84d') {
  const gs = document.getElementById('goalScreen');
  const gt = gs.querySelector('.goal-text');
  gt.textContent = text;
  gt.style.color = color;
  gt.style.textShadow = `0 0 40px ${color}, 0 0 80px ${color}`;
  gs.style.display = 'flex';
  setTimeout(() => { gs.style.display = 'none'; }, 2000);
}

// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
function spawnParticles(x, y, z, color) {
  for (let i = 0; i < 30; i++) {
    const g = new THREE.SphereGeometry(0.08, 6, 6);
    const m = new THREE.MeshBasicMaterial({ color });
    const p = new THREE.Mesh(g, m);
    p.position.set(x + (Math.random()-.5)*2, y, z + (Math.random()-.5)*2);
    p.userData.vel = {
      x: (Math.random()-.5)*0.3,
      y: Math.random()*0.4,
      z: (Math.random()-.5)*0.3
    };
    p.userData.life = 60;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.x += p.userData.vel.x;
    p.position.y += p.userData.vel.y;
    p.position.z += p.userData.vel.z;
    p.userData.vel.y -= 0.02;
    p.userData.life--;
    p.material.opacity = p.userData.life / 60;
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

// ═══════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════
function updateCamera() {
  const targetX = player.position.x * 0.3;
  const targetZ = player.position.z * 0.2 + 22;
  const targetY = 16 + ball.position.y * 0.5;

  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.z += (targetZ - camera.position.z) * 0.05;
  camera.position.y += (targetY - camera.position.y) * 0.05;
  camera.lookAt(ball.position.x * 0.3, 0, ball.position.z * 0.1);
}

// ═══════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════
let lastTimerTick = 0;
function updateTimer(dt) {
  if (!running || paused) return;
  lastTimerTick += dt;
  if (lastTimerTick >= 1) {
    lastTimerTick = 0;
    timeLeft--;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame();
    }
  }
  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  document.getElementById('matchTime').textContent =
    String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
function gameLoop() {
  animId = requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (running && !paused) {
    updatePlayer(dt);
    updateAI(dt);
    updateBall(dt);
    updateCamera();
    updateTimer(dt);
    updateParticles();
  }

  renderer.render(scene, camera);
}

// ═══════════════════════════════════════
//  UI FUNCTIONS
// ═══════════════════════════════════════
function setDiff(d, el) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function startGame() {
  homeName = document.getElementById('menuHome')?.value || homeName;
  awayName = document.getElementById('menuAway')?.value || awayName;
  matchDuration = parseInt(document.getElementById('menuTime')?.value || 300);
  timeLeft = matchDuration;
  scoreHome = 0;
  scoreAway = 0;
  document.getElementById('scoreHome').textContent = '0';
  document.getElementById('scoreAway').textContent = '0';
  document.getElementById('homeName').textContent = homeName;
  document.getElementById('awayName').textContent = awayName;
  document.getElementById('menu').style.display   = 'none';
  document.getElementById('ftScreen').style.display = 'none';
  running = true;
  paused  = false;
  resetPositions();
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById('pauseScreen').style.display = paused ? 'flex' : 'none';
}

function returnMenu() {
  running = false;
  paused  = false;
  document.getElementById('pauseScreen').style.display = 'none';
  document.getElementById('ftScreen').style.display    = 'none';
  document.getElementById('menu').style.display        = 'flex';
  resetPositions();
}

function endGame() {
  running = false;
  const ft    = document.getElementById('ftScreen');
  const res   = document.getElementById('ftResult');
  document.getElementById('ftScore').textContent = scoreHome + ' : ' + scoreAway;
  document.getElementById('ftTeams').textContent = homeName + ' vs ' + awayName;

  if (scoreHome > scoreAway)      { res.textContent = 'YOU WIN! 🏆'; res.className = 'ft-result win'; }
  else if (scoreAway > scoreHome) { res.textContent = 'YOU LOSE';    res.className = 'ft-result loss'; }
  else                             { res.textContent = "IT'S A DRAW"; res.className = 'ft-result draw'; }

  ft.style.display = 'flex';
}

function updateKeyHints() {
  const map = { kw:'KeyW', ka:'KeyA', ks:'KeyS', kd:'KeyD', ksp:'Space' };
  Object.entries(map).forEach(([id, code]) => {
    document.getElementById(id)?.classList.toggle('active', !!keys[code]);
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
initThree();
gameLoop();
</script>
