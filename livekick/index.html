<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Football Streams</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0f1520;
    --surface2: #161e2e;
    --border: #1e2d42;
    --accent: #00e5ff;
    --accent2: #ff3d5a;
    --green: #00ff88;
    --text: #e8f0fe;
    --muted: #5a7090;
    --card-hover: #1a2535;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,12,16,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .logo span { color: var(--accent2); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .live-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .live-dot::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  #refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  #refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(0,229,255,0.2);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .page-title em {
    color: var(--accent);
    font-style: normal;
    text-shadow: 0 0 30px rgba(0,229,255,0.3);
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
  }

  #status-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    min-height: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #status-bar.loading { color: var(--accent); }
  #status-bar.error { color: var(--accent2); }
  #status-bar.success { color: var(--green); }

  /* Match grid */
  #matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1rem;
  }

  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .match-card:hover {
    border-color: rgba(0,229,255,0.3);
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,229,255,0.1);
  }

  .match-card:hover::before { opacity: 1; }

  .match-card.live { border-color: rgba(0,255,136,0.3); }
  .match-card.live::before {
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 1;
    animation: shimmer 2s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  .card-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .league-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }

  .match-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .match-status.live {
    background: rgba(0,255,136,0.15);
    color: var(--green);
    border: 1px solid rgba(0,255,136,0.3);
  }

  .match-status.upcoming {
    background: rgba(0,229,255,0.1);
    color: var(--accent);
    border: 1px solid rgba(0,229,255,0.2);
  }

  .match-status.finished {
    background: rgba(90,112,144,0.15);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .card-body {
    padding: 16px;
  }

  .teams {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .team {
    flex: 1;
    text-align: center;
  }

  .team-name {
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text);
  }

  .score-block {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--text);
    line-height: 1;
    min-width: 24px;
    text-align: center;
  }

  .score-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--muted);
  }

  .match-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 12px;
  }

  .stream-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .stream-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 500;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .stream-btn.primary {
    background: rgba(0,229,255,0.12);
    color: var(--accent);
    border: 1px solid rgba(0,229,255,0.25);
  }

  .stream-btn.primary:hover {
    background: rgba(0,229,255,0.22);
    box-shadow: 0 0 16px rgba(0,229,255,0.2);
  }

  .stream-btn.secondary {
    background: rgba(255,61,90,0.1);
    color: var(--accent2);
    border: 1px solid rgba(255,61,90,0.2);
  }

  .stream-btn.secondary:hover {
    background: rgba(255,61,90,0.2);
  }

  .stream-btn.alt {
    background: rgba(90,112,144,0.15);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .stream-btn.alt:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  /* Player modal */
  #player-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  #player-modal.open { display: flex; }

  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 960px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: var(--text);
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover { border-color: var(--accent2); color: var(--accent2); }

  .modal-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    overflow-x: auto;
  }

  .modal-tab {
    padding: 10px 16px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .modal-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .player-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
  }

  .player-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .no-embed-msg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    text-align: center;
    gap: 12px;
  }

  .no-embed-msg a {
    color: var(--accent);
    text-decoration: none;
    border: 1px solid rgba(0,229,255,0.3);
    padding: 8px 20px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .no-embed-msg a:hover { background: rgba(0,229,255,0.1); }

  /* Skeleton loader */
  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    animation: skel-pulse 1.5s ease infinite;
  }

  @keyframes skel-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .skel-line {
    background: var(--border);
    border-radius: 4px;
    margin-bottom: 10px;
  }

  /* Error & empty states */
  .state-box {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  .state-box h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 3px;
    margin-bottom: 0.5rem;
  }

  .state-box p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .state-box button {
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    padding: 10px 24px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .state-box button:hover { background: rgba(0,229,255,0.2); }

  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--border);
    padding: 1.5rem 2rem;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 3rem;
  }

  @media (max-width: 600px) {
    main { padding: 1rem; }
    #matches-grid { grid-template-columns: 1fr; }
    header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">LIVE<span>KICK</span></div>
  <div class="header-right">
    <div class="live-dot">Live</div>
    <button id="refresh-btn" onclick="loadMatches()">↺ REFRESH</button>
  </div>
</header>

<main>
  <h1 class="page-title">TODAY'S <em>MATCHES</em></h1>
  <p class="subtitle" id="date-label">— Loading schedule —</p>
  <div id="status-bar" class="loading">⬡ Fetching live streams…</div>
  <div id="matches-grid"></div>
</main>

<!-- Player Modal -->
<div id="player-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">STREAM</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="player-container"></div>
  </div>
</div>

<footer>
  LIVEKICK — STREAMS SOURCED FROM HESGOAL-LIVE.FIT &nbsp;·&nbsp; FOR PERSONAL USE ONLY
</footer>

<script>
// ──────────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────────
const SOURCE_URL = 'https://hesgoal-live.fit/';

// Multiple CORS proxy options (fallback chain)
const CORS_PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];

let allMatches = [];
let activeStreams = [];

// ──────────────────────────────────────────────
// DATE LABEL
// ──────────────────────────────────────────────
function setDateLabel() {
  const d = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date-label').textContent =
    '— ' + d.toLocaleDateString('en-GB', opts) + ' —';
}

// ──────────────────────────────────────────────
// FETCH WITH PROXY FALLBACK
// ──────────────────────────────────────────────
async function fetchWithProxy(url) {
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    try {
      const proxyUrl = CORS_PROXIES[i](url);
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const data = await res.json();
      // allorigins wraps in {contents}, corsproxy returns raw text
      return data.contents || await res.text?.() || JSON.stringify(data);
    } catch(e) {
      if (i === CORS_PROXIES.length - 1) throw e;
    }
  }
}

// ──────────────────────────────────────────────
// PARSE HESGOAL HTML
// ──────────────────────────────────────────────
function parseMatches(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const matches = [];

  // Try common selectors used by sports stream sites
  const selectors = [
    '.match', '.fixture', '.game', '.event',
    '[class*="match"]', '[class*="fixture"]', '[class*="game"]',
    'article', 'li.match-item', '.schedule-item', '.stream-item',
    'tr.match', '.match-row', '.live-match'
  ];

  let items = [];
  for (const sel of selectors) {
    const found = doc.querySelectorAll(sel);
    if (found.length > 0) { items = Array.from(found); break; }
  }

  // Also check for JSON embedded in <script> tags
  const scripts = doc.querySelectorAll('script');
  for (const s of scripts) {
    const txt = s.textContent;
    // Look for match data arrays
    const jsonMatch = txt.match(/(?:matches|fixtures|events|schedule)\s*=\s*(\[[\s\S]+?\]);/);
    if (jsonMatch) {
      try {
        const data = JSON.parse(jsonMatch[1]);
        if (Array.isArray(data) && data.length > 0) return normaliseJsonMatches(data);
      } catch(e) {}
    }
    // Look for window.__DATA__ or similar
    const dataMatch = txt.match(/window\.__(?:DATA|STATE|MATCHES)__\s*=\s*(\{[\s\S]+?\});/);
    if (dataMatch) {
      try {
        const data = JSON.parse(dataMatch[1]);
        const arr = data.matches || data.fixtures || data.events || [];
        if (arr.length > 0) return normaliseJsonMatches(arr);
      } catch(e) {}
    }
  }

  // Parse DOM items found
  for (const el of items) {
    const match = parseMatchElement(el);
    if (match) matches.push(match);
  }

  return matches;
}

function normaliseJsonMatches(arr) {
  return arr.map(m => ({
    id: m.id || m.match_id || Math.random().toString(36).slice(2),
    home: m.home || m.home_team || m.homeTeam || m.team1 || '?',
    away: m.away || m.away_team || m.awayTeam || m.team2 || '?',
    score: m.score || (m.home_score != null ? `${m.home_score} - ${m.away_score}` : null),
    time: m.time || m.match_time || m.kickoff || '',
    league: m.league || m.competition || m.tournament || '',
    status: detectStatus(m.status || m.state || ''),
    links: extractLinks(m),
    streamUrl: m.stream || m.embed || m.iframe || m.url || null,
  }));
}

function parseMatchElement(el) {
  const text = el.textContent.trim();
  if (!text || text.length < 5) return null;

  // Extract teams (try various patterns)
  const teamEls = el.querySelectorAll('.team, .team-name, [class*="team"], [class*="home"], [class*="away"]');
  let home = '', away = '';
  if (teamEls.length >= 2) {
    home = teamEls[0].textContent.trim();
    away = teamEls[1].textContent.trim();
  } else {
    // Fallback: split by ' vs ' or ' - '
    const vsMatch = text.match(/^(.+?)\s+(?:vs\.?|-)\s+(.+?)(?:\s+\d|$)/i);
    if (vsMatch) { home = vsMatch[1].trim(); away = vsMatch[2].trim(); }
  }

  const scoreEl = el.querySelector('.score, [class*="score"], [class*="result"]');
  const score = scoreEl ? scoreEl.textContent.trim() : null;

  const timeEl = el.querySelector('.time, [class*="time"], [class*="kick"]');
  const time = timeEl ? timeEl.textContent.trim() : '';

  const leagueEl = el.querySelector('.league, [class*="league"], [class*="competition"], [class*="tournament"]');
  const league = leagueEl ? leagueEl.textContent.trim() : '';

  const statusEl = el.querySelector('.status, [class*="status"], [class*="live"]');
  const statusTxt = statusEl ? statusEl.textContent.trim() : '';

  // Extract any links
  const anchors = Array.from(el.querySelectorAll('a[href]')).map(a => ({
    label: a.textContent.trim() || 'Stream',
    url: a.href
  }));

  if (!home && !away && !score) return null;

  return {
    id: Math.random().toString(36).slice(2),
    home: home || 'Home',
    away: away || 'Away',
    score,
    time,
    league,
    status: detectStatus(statusTxt),
    links: anchors,
    streamUrl: anchors[0]?.url || null,
    el_html: el.innerHTML, // keep raw for stream scraping
  };
}

function detectStatus(txt) {
  txt = (txt || '').toLowerCase();
  if (txt.includes('live') || txt.includes('progress') || txt.includes("'") || /\d+'/.test(txt)) return 'live';
  if (txt.includes('ft') || txt.includes('finished') || txt.includes('ended') || txt.includes('full')) return 'finished';
  return 'upcoming';
}

function extractLinks(m) {
  const links = [];
  if (m.stream) links.push({ label: 'Stream 1', url: m.stream });
  if (m.stream2) links.push({ label: 'Stream 2', url: m.stream2 });
  if (m.embed) links.push({ label: 'Embed', url: m.embed });
  if (m.url && m.url !== m.stream) links.push({ label: 'Watch', url: m.url });
  return links;
}

// ──────────────────────────────────────────────
// FETCH STREAM PAGE FOR EMBEDS
// ──────────────────────────────────────────────
async function fetchStreamEmbeds(matchUrl) {
  try {
    const html = await fetchWithProxy(matchUrl);
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    const embeds = [];

    // Look for iframes
    doc.querySelectorAll('iframe[src]').forEach(iframe => {
      const src = iframe.src || iframe.getAttribute('src');
      if (src && !src.includes('ads') && !src.includes('google')) {
        embeds.push({ type: 'iframe', url: src, label: `Stream ${embeds.length + 1}` });
      }
    });

    // Look for stream links / buttons
    doc.querySelectorAll('a[href*="stream"], a[href*="watch"], a[href*="live"], button[data-src], [data-stream]').forEach(el => {
      const url = el.href || el.dataset.src || el.dataset.stream;
      if (url) embeds.push({ type: 'link', url, label: el.textContent.trim() || `Link ${embeds.length + 1}` });
    });

    // Look for embedded JS stream data
    doc.querySelectorAll('script').forEach(s => {
      const txt = s.textContent;
      // Common stream var patterns
      const urlMatches = txt.matchAll(/(?:src|url|stream|iframe|embed)\s*[:=]\s*['"]([^'"]+m3u8[^'"]*|[^'"]*embed[^'"]*|[^'"]*stream[^'"]*)['"]/gi);
      for (const m of urlMatches) {
        if (m[1] && m[1].startsWith('http')) {
          embeds.push({ type: 'iframe', url: m[1], label: `Stream ${embeds.length + 1}` });
        }
      }
    });

    return embeds;
  } catch(e) {
    return [];
  }
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function renderSkeletons(n = 6) {
  const grid = document.getElementById('matches-grid');
  grid.innerHTML = Array(n).fill(0).map(() => `
    <div class="skeleton-card">
      <div class="skel-line" style="height:12px;width:60%;margin-bottom:14px"></div>
      <div class="skel-line" style="height:40px;width:80%;margin:0 auto 10px"></div>
      <div class="skel-line" style="height:10px;width:40%;margin:0 auto 14px"></div>
      <div style="display:flex;gap:6px">
        <div class="skel-line" style="height:28px;flex:1"></div>
        <div class="skel-line" style="height:28px;flex:1"></div>
      </div>
    </div>
  `).join('');
}

function renderMatches(matches) {
  const grid = document.getElementById('matches-grid');

  if (!matches.length) {
    grid.innerHTML = `
      <div class="state-box">
        <h3>NO MATCHES FOUND</h3>
        <p>// Could not parse match data from source</p>
        <button onclick="loadMatches()">↺ TRY AGAIN</button>
      </div>`;
    return;
  }

  grid.innerHTML = matches.map(m => renderCard(m)).join('');
}

function renderCard(m) {
  const isLive = m.status === 'live';
  const isFinished = m.status === 'finished';
  const statusLabel = isLive ? 'LIVE' : isFinished ? 'FT' : m.time || 'UPCOMING';
  const statusClass = isLive ? 'live' : isFinished ? 'finished' : 'upcoming';

  const scoreHtml = m.score
    ? (() => {
        const parts = m.score.replace(/\s/g, '').split(/[-:]/);
        const hs = parts[0] || '-', as = parts[1] || '-';
        return `
          <div class="score-block">
            <span class="score">${hs}</span>
            <span class="score-sep">:</span>
            <span class="score">${as}</span>
          </div>`;
      })()
    : `<div class="score-block"><span class="score-sep" style="font-size:1rem;color:var(--muted)">VS</span></div>`;

  const streamBtns = m.links.slice(0, 3).map((l, i) =>
    `<button class="stream-btn ${i===0?'primary':i===1?'secondary':'alt'}"
        onclick="event.stopPropagation();openStream('${escHtml(l.url)}','${escHtml(m.home)} vs ${escHtml(m.away)}')">
      ▶ ${escHtml(l.label.slice(0, 20))}
    </button>`
  ).join('');

  const watchBtn = m.streamUrl
    ? `<button class="stream-btn primary"
          onclick="event.stopPropagation();watchMatch(event,'${m.id}','${escHtml(m.streamUrl)}','${escHtml(m.home)} vs ${escHtml(m.away)}')">
        ▶ WATCH
      </button>` : '';

  return `
    <div class="match-card ${isLive ? 'live' : ''}"
         onclick="watchMatch(event,'${m.id}','${escHtml(m.streamUrl||'')}','${escHtml(m.home)} vs ${escHtml(m.away)}')">
      <div class="card-header">
        <span class="league-tag">${escHtml(m.league || 'Football')}</span>
        <span class="match-status ${statusClass}">${escHtml(statusLabel)}</span>
      </div>
      <div class="card-body">
        <div class="teams">
          <div class="team"><div class="team-name">${escHtml(m.home)}</div></div>
          ${scoreHtml}
          <div class="team"><div class="team-name">${escHtml(m.away)}</div></div>
        </div>
        <div class="stream-links">
          ${streamBtns || watchBtn || `<span style="color:var(--muted);font-size:0.75rem;font-family:'JetBrains Mono'">Click to find streams</span>`}
        </div>
      </div>
    </div>`;
}

function escHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ──────────────────────────────────────────────
// MODAL / PLAYER
// ──────────────────────────────────────────────
async function watchMatch(e, id, url, title) {
  openModal(title, []);
  setStatus('Fetching stream links…', 'loading');

  let embeds = [];
  if (url) embeds = await fetchStreamEmbeds(url);

  // Also check if we have stored match data with links
  const match = allMatches.find(m => m.id === id);
  if (match?.links?.length) {
    match.links.forEach(l => {
      if (!embeds.find(e => e.url === l.url)) {
        embeds.push({ type: 'link', url: l.url, label: l.label });
      }
    });
  }

  openModal(title, embeds, url);
  setStatus(embeds.length ? `${embeds.length} stream(s) found` : 'No embeds found', embeds.length ? 'success' : 'error');
}

function openStream(url, title) {
  openModal(title, [{ type: 'iframe', url, label: 'Stream 1' }], url);
}

function openModal(title, embeds, fallbackUrl) {
  document.getElementById('modal-title').textContent = title || 'STREAM';
  const modal = document.getElementById('player-modal');
  modal.classList.add('open');

  const tabsEl = document.getElementById('modal-tabs');
  const playerEl = document.getElementById('player-container');

  if (!embeds.length) {
    tabsEl.innerHTML = '';
    playerEl.innerHTML = `
      <div class="no-embed-msg">
        <span>// No embeddable stream detected</span>
        ${fallbackUrl ? `<a href="${escHtml(fallbackUrl)}" target="_blank" rel="noopener">Open on HesGoal ↗</a>` : ''}
      </div>`;
    return;
  }

  activeStreams = embeds;

  tabsEl.innerHTML = embeds.map((s, i) =>
    `<div class="modal-tab ${i===0?'active':''}" onclick="switchTab(${i})">${escHtml(s.label || `Stream ${i+1}`)}</div>`
  ).join('');

  loadEmbed(embeds[0]);
}

function switchTab(i) {
  document.querySelectorAll('.modal-tab').forEach((t,j) => t.classList.toggle('active', i===j));
  loadEmbed(activeStreams[i]);
}

function loadEmbed(stream) {
  const el = document.getElementById('player-container');
  if (!stream) { el.innerHTML = ''; return; }

  if (stream.type === 'iframe' || stream.url?.includes('embed') || stream.url?.includes('.m3u8') || stream.url?.includes('stream')) {
    el.innerHTML = `
      <div class="player-wrapper">
        <iframe src="${escHtml(stream.url)}" allowfullscreen allow="autoplay; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="no-embed-msg">
        <span>// External link — cannot embed directly</span>
        <a href="${escHtml(stream.url)}" target="_blank" rel="noopener">Open stream ↗</a>
      </div>`;
  }
}

function closeModal() {
  document.getElementById('player-modal').classList.remove('open');
  document.getElementById('player-container').innerHTML = '';
  document.getElementById('modal-tabs').innerHTML = '';
}

// Close on backdrop click
document.getElementById('player-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ──────────────────────────────────────────────
// MAIN LOAD
// ──────────────────────────────────────────────
function setStatus(msg, type = '') {
  const el = document.getElementById('status-bar');
  el.textContent = (type === 'loading' ? '⬡ ' : type === 'error' ? '⚠ ' : '✓ ') + msg;
  el.className = type;
}

async function loadMatches() {
  setStatus('Fetching live schedule from HesGoal…', 'loading');
  renderSkeletons();

  try {
    const html = await fetchWithProxy(SOURCE_URL);
    if (!html) throw new Error('Empty response');

    const matches = parseMatches(html);
    allMatches = matches;

    if (matches.length) {
      setStatus(`${matches.length} match${matches.length > 1 ? 'es' : ''} loaded`, 'success');
      renderMatches(matches);
    } else {
      // HesGoal is JS-rendered — show helpful fallback
      setStatus('Source is JS-rendered. Showing direct link fallback.', 'error');
      renderFallback();
    }
  } catch(e) {
    console.error(e);
    setStatus('Failed to reach source. Check CORS proxy or network.', 'error');
    renderError(e.message);
  }
}

function renderFallback() {
  const grid = document.getElementById('matches-grid');
  grid.innerHTML = `
    <div class="state-box" style="grid-column:1/-1">
      <h3>JS-RENDERED SOURCE</h3>
      <p>// HesGoal loads match data via JavaScript in the browser.<br>
         // A server-side proxy or browser extension is needed to access its live API.<br>
         // Click below to open HesGoal directly and copy stream links here.</p>
      <a href="https://hesgoal-live.fit/" target="_blank" rel="noopener"
         style="display:inline-block;margin-top:1rem;padding:10px 24px;background:rgba(0,229,255,0.1);
                border:1px solid rgba(0,229,255,0.3);color:var(--accent);border-radius:8px;
                font-family:'JetBrains Mono',monospace;font-size:0.8rem;text-decoration:none;
                transition:all 0.2s">
        Open HesGoal ↗
      </a>
      <div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)">
        <p style="margin-bottom:1rem">// Or paste a HesGoal match URL below to load its streams:</p>
        <div style="display:flex;gap:8px;justify-content:center;max-width:500px;margin:0 auto">
          <input id="manual-url" placeholder="https://hesgoal-live.fit/match/..." 
            style="flex:1;background:var(--surface2);border:1px solid var(--border);
                   color:var(--text);padding:8px 12px;border-radius:8px;
                   font-family:'JetBrains Mono',monospace;font-size:0.75rem;outline:none"/>
          <button onclick="loadManualUrl()"
            style="background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);
                   color:var(--accent);padding:8px 16px;border-radius:8px;cursor:pointer;
                   font-family:'JetBrains Mono',monospace;font-size:0.75rem">
            LOAD
          </button>
        </div>
      </div>
    </div>`;
}

async function loadManualUrl() {
  const url = document.getElementById('manual-url')?.value?.trim();
  if (!url || !url.startsWith('http')) return;
  openStream(url, 'Manual Stream');
}

function renderError(msg) {
  document.getElementById('matches-grid').innerHTML = `
    <div class="state-box">
      <h3>CONNECTION ERROR</h3>
      <p>// ${escHtml(msg)}</p>
      <button onclick="loadMatches()">↺ RETRY</button>
    </div>`;
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
setDateLabel();
loadMatches();

// Auto-refresh every 3 minutes
setInterval(loadMatches, 3 * 60 * 1000);
</script>
</body>
</html>
