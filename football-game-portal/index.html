    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            color: #eee;
        }

        .game-header {
            background: #0f0f0f;
            padding: 0.8rem 2rem;
            border-bottom: 1px solid #00ffff22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-btn {
            background: #00ffff11;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.3rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .logo-btn:hover {
            background: #00ffff22;
            box-shadow: 0 0 10px #00ffff66;
        }

        .page-title {
            color: #00ffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .team-selector {
            background: #111;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: flex-end;
        }

        .team-select {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 0.5rem;
            min-width: 160px;
        }

        .team-select label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 0.3rem;
        }

        select, button {
            width: 100%;
            padding: 0.5rem;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }

        .start-btn {
            background: #00ffff;
            color: #0a0a0a;
            font-weight: bold;
            padding: 0.5rem 1.5rem;
            min-width: 120px;
            border: none;
        }

        .start-btn:hover {
            background: #ff3366;
            color: white;
        }

        .game-area {
            background: #000000aa;
            border-radius: 24px;
            padding: 1rem;
            border: 1px solid #00ffff33;
            text-align: center;
        }

        canvas {
            background: #1a6b1a;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,255,255,0.15);
            max-width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 1rem;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .score-home, .score-away {
            background: #0a0a0a;
            padding: 0.3rem 1.5rem;
            border-radius: 12px;
            border: 1px solid #00ffff;
        }

        .game-info {
            margin-top: 1rem;
            color: #00ffff;
            font-size: 0.9rem;
        }

        .controls-hint {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #666;
        }

        @media (max-width: 700px) {
            .team-selector { flex-direction: column; align-items: stretch; }
            .score-board { gap: 1rem; font-size: 1.2rem; }
            .score-home, .score-away { padding: 0.2rem 0.8rem; }
        }
    </style>
</head>
<body>

<div class="game-header">
    <a href="https://web-maker-designer.github.io" class="logo-btn">
        ⚡ WEB MAKER
    </a>
    <div class="page-title">
        ⚽ FC 26 — FULL 11v11 FOOTBALL GAME
    </div>
    <div style="font-size:0.7rem; color:#ff3366;">⚡ 22 PLAYERS + REAL BALL PHYSICS</div>
</div>

<div class="main-container">
    <div class="team-selector">
        <div class="team-select">
            <label>🏆 HOME TEAM (Red)</label>
            <select id="homeTeamSelect">
                <option value="Barcelona">FC Barcelona</option>
                <option value="Real Madrid">Real Madrid</option>
                <option value="Man United" selected>Manchester United</option>
                <option value="Liverpool">Liverpool FC</option>
                <option value="Bayern">Bayern Munich</option>
                <option value="PSG">Paris SG</option>
                <option value="Man City">Man City</option>
                <option value="Chelsea">Chelsea FC</option>
                <option value="Arsenal">Arsenal</option>
                <option value="Juventus">Juventus</option>
            </select>
        </div>
        <div class="team-select">
            <label>⚔️ AWAY TEAM (Blue)</label>
            <select id="awayTeamSelect">
                <option value="Real Madrid" selected>Real Madrid</option>
                <option value="Barcelona">FC Barcelona</option>
                <option value="Liverpool">Liverpool FC</option>
                <option value="Bayern">Bayern Munich</option>
                <option value="PSG">Paris SG</option>
                <option value="Man City">Man City</option>
                <option value="Chelsea">Chelsea FC</option>
                <option value="Arsenal">Arsenal</option>
                <option value="Juventus">Juventus</option>
                <option value="Inter Milan">Inter Milan</option>
            </select>
        </div>
        <button class="start-btn" id="startGameBtn">▶ KICK OFF</button>
    </div>

    <div class="game-area">
        <div class="score-board">
            <div class="score-home" id="homeScoreDisplay">HOME 0</div>
            <div class="score-away" id="awayScoreDisplay">AWAY 0</div>
        </div>
        <canvas id="gameCanvas" width="1000" height="550" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/550"></canvas>
        <div class="game-info" id="gameStatus">
            ⚽ SELECT TEAMS & PRESS KICK OFF
        </div>
        <div class="controls-hint">
            🖱️ CLICK ON BALL → DRAG MOUSE TO AIM → RELEASE TO KICK | AI CONTROLS ALL 22 PLAYERS
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const homeScoreSpan = document.getElementById('homeScoreDisplay');
    const awayScoreSpan = document.getElementById('awayScoreDisplay');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startGameBtn');
    const homeTeamSelect = document.getElementById('homeTeamSelect');
    const awayTeamSelect = document.getElementById('awayTeamSelect');

    let homeScore = 0, awayScore = 0;
    let gameActive = false;
    let animationId = null;
    let homeTeam = "Manchester United";
    let awayTeam = "Real Madrid";

    // BALL
    let ball = { x: 500, y: 275, vx: 0, vy: 0, radius: 7 };

    // PLAYERS: each has x, y, team ('home' or 'away'), role, vx, vy (simple AI movement)
    let players = [];
    
    function initPlayers() {
        players = [];
        // Home team (red) - 11 players: positions from left side attacking right
        const homePositions = [
            { x: 80, y: 270, role: "GK" },  // goalkeeper
            { x: 160, y: 200, role: "LB" }, { x: 160, y: 340, role: "RB" },
            { x: 220, y: 270, role: "CB" }, { x: 260, y: 220, role: "CDM" }, { x: 260, y: 320, role: "CDM" },
            { x: 330, y: 180, role: "LM" }, { x: 330, y: 360, role: "RM" },
            { x: 390, y: 250, role: "CAM" }, { x: 390, y: 300, role: "CAM" },
            { x: 470, y: 275, role: "ST" }
        ];
        // Away team (blue) - 11 players attacking left
        const awayPositions = [
            { x: 920, y: 270, role: "GK" },
            { x: 840, y: 200, role: "LB" }, { x: 840, y: 340, role: "RB" },
            { x: 780, y: 270, role: "CB" }, { x: 740, y: 220, role: "CDM" }, { x: 740, y: 320, role: "CDM" },
            { x: 670, y: 180, role: "LM" }, { x: 670, y: 360, role: "RM" },
            { x: 610, y: 250, role: "CAM" }, { x: 610, y: 300, role: "CAM" },
            { x: 530, y: 275, role: "ST" }
        ];
        
        for (let pos of homePositions) {
            players.push({ ...pos, team: 'home', vx: 0, vy: 0, size: 11 });
        }
        for (let pos of awayPositions) {
            players.push({ ...pos, team: 'away', vx: 0, vy: 0, size: 11 });
        }
    }

    // AI movement: players chase ball, stay in formation roughly
    function movePlayers() {
        if (!gameActive) return;
        for (let p of players) {
            // simple AI: move toward ball but with inertia and formation bias
            let targetX = ball.x;
            let targetY = ball.y;
            // keep goalies near goal
            if (p.role === "GK") {
                if (p.team === 'home') targetX = 60;
                else targetX = 940;
                targetY = 275;
            }
            let dx = targetX - p.x;
            let dy = targetY - p.y;
            let dist = Math.hypot(dx, dy);
            let speed = 2.2;
            if (dist > 5) {
                p.vx += (dx / dist) * 0.5;
                p.vy += (dy / dist) * 0.5;
            }
            // friction
            p.vx *= 0.92;
            p.vy *= 0.92;
            let maxSpeed = 3.5;
            p.vx = Math.min(maxSpeed, Math.max(-maxSpeed, p.vx));
            p.vy = Math.min(maxSpeed, Math.max(-maxSpeed, p.vy));
            p.x += p.vx;
            p.y += p.vy;
            // boundaries
            p.x = Math.min(960, Math.max(40, p.x));
            p.y = Math.min(530, Math.max(20, p.y));
            
            // collision with ball
            let ballDist = Math.hypot(p.x - ball.x, p.y - ball.y);
            if (ballDist < p.size + ball.radius) {
                // kick ball away from player
                let angle = Math.atan2(ball.y - p.y, ball.x - p.x);
                let force = 4.5;
                ball.vx = Math.cos(angle) * force + (p.vx * 0.5);
                ball.vy = Math.sin(angle) * force + (p.vy * 0.5);
                // tiny random
                ball.vx += (Math.random() - 0.5) * 1.2;
                ball.vy += (Math.random() - 0.5) * 1.2;
                // push ball away
                let overlap = p.size + ball.radius - ballDist;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
            }
        }
    }

    function updateBall() {
        if (!gameActive) return;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.99;
        ball.vy *= 0.99;
        
        // wall collisions
        if (ball.x - ball.radius < 15) { ball.x = 15 + ball.radius; ball.vx = -ball.vx * 0.6; }
        if (ball.x + ball.radius > 985) { ball.x = 985 - ball.radius; ball.vx = -ball.vx * 0.6; }
        if (ball.y - ball.radius < 15) { ball.y = 15 + ball.radius; ball.vy = -ball.vy * 0.6; }
        if (ball.y + ball.radius > 535) { ball.y = 535 - ball.radius; ball.vy = -ball.vy * 0.6; }
        
        // GOAL CHECK
        // left goal (home scores if away touches? Actually home goal is left side, away attacks right)
        if (ball.x - ball.radius < 25 && ball.y > 220 && ball.y < 330) {
            awayScore++;
            updateScoreUI();
            gameStatus.innerText = `⚽⚽⚽ GOAL! ${awayTeam} SCORES! ⚽⚽⚽  ${homeScore} - ${awayScore}`;
            resetBallAfterGoal();
        }
        // right goal
        else if (ball.x + ball.radius > 975 && ball.y > 220 && ball.y < 330) {
            homeScore++;
            updateScoreUI();
            gameStatus.innerText = `⚽⚽⚽ GOAL! ${homeTeam} SCORES! ⚽⚽⚽  ${homeScore} - ${awayScore}`;
            resetBallAfterGoal();
        }
    }
    
    function resetBallAfterGoal() {
        ball.x = 500;
        ball.y = 275;
        ball.vx = 0;
        ball.vy = 0;
        // reset player positions after 1 sec
        setTimeout(() => {
            if (gameActive) initPlayers();
        }, 500);
    }
    
    function updateScoreUI() {
        homeScoreSpan.innerText = `${homeTeam} ${homeScore}`;
        awayScoreSpan.innerText = `${awayTeam} ${awayScore}`;
    }
    
    // DRAW EVERYTHING
    function drawPitch() {
        ctx.fillStyle = "#1a8a2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.strokeRect(30, 30, canvas.width-60, canvas.height-60);
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 45, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 30);
        ctx.lineTo(canvas.width/2, canvas.height-30);
        ctx.stroke();
        // penalty areas
        ctx.strokeRect(30, canvas.height/2-55, 55, 110);
        ctx.strokeRect(canvas.width-85, canvas.height/2-55, 55, 110);
        // goals
        ctx.fillStyle = "#ccccaa";
        ctx.fillRect(15, canvas.height/2-30, 20, 60);
        ctx.fillRect(canvas.width-35, canvas.height/2-30, 20, 60);
    }
    
    function drawPlayers() {
        for (let p of players) {
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size-2, 0, Math.PI*2);
            ctx.fillStyle = p.team === 'home' ? "#e34234" : "#2a6fdb";
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.font = "bold 10px monospace";
            ctx.fillText(p.role, p.x-8, p.y-6);
            ctx.fillStyle = "black";
            ctx.font = "bold 8px monospace";
            ctx.fillText(p.role === "ST" ? "⚽" : (p.role === "GK" ? "🧤" : "●"), p.x-3, p.y+3);
        }
    }
    
    function drawBall() {
        ctx.shadowBlur = 8;
        ctx.shadowColor = "white";
        ctx.fillStyle = "#ffffdd";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(ball.x-2, ball.y-2, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y-4);
        ctx.lineTo(ball.x+3, ball.y);
        ctx.lineTo(ball.x-3, ball.y);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    function drawGame() {
        drawPitch();
        drawPlayers();
        drawBall();
        ctx.fillStyle = "#ffffaa";
        ctx.font = "bold 12px monospace";
        ctx.fillText(`${homeTeam} vs ${awayTeam}`, canvas.width/2-80, 22);
    }
    
    // USER KICK (click/tap on ball and drag)
    let dragging = false;
    let startDrag = { x: 0, y: 0 };
    
    function getMouseCoord(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else { clientX = e.clientX; clientY = e.clientY; }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }
    
    function onPointerDown(e) {
        if (!gameActive) return;
        const coord = getMouseCoord(e);
        const distToBall = Math.hypot(coord.x - ball.x, coord.y - ball.y);
        if (distToBall < 25) {
            dragging = true;
            startDrag = coord;
            e.preventDefault();
        }
    }
    
    function onPointerUp(e) {
        if (!gameActive || !dragging) return;
        const coord = getMouseCoord(e);
        let dx = startDrag.x - coord.x;
        let dy = startDrag.y - coord.y;
        let power = Math.min(18, Math.hypot(dx, dy) / 12);
        if (power > 1.5) {
            ball.vx = dx / 8 * power;
            ball.vy = dy / 8 * power;
            gameStatus.innerText = `💥 SHOT! Power: ${Math.floor(power*10)}%`;
        }
        dragging = false;
    }
    
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown);
    canvas.addEventListener('touchend', onPointerUp);
    
    // GAME LOOP
    function gameLoop() {
        if (gameActive) {
            movePlayers();
            updateBall();
        }
        drawGame();
        animationId = requestAnimationFrame(gameLoop);
    }
    
    function startMatch() {
        gameActive = true;
        homeTeam = homeTeamSelect.value;
        awayTeam = awayTeamSelect.value;
        homeScore = 0;
        awayScore = 0;
        updateScoreUI();
        initPlayers();
        ball = { x: 500, y: 275, vx: 0, vy: 0, radius: 7 };
        gameStatus.innerText = `⚽ KICK OFF! ${homeTeam} vs ${awayTeam} | Click ball and drag to shoot!`;
        dragging = false;
    }
    
    startBtn.addEventListener('click', () => startMatch());
    
    // initial
    initPlayers();
    updateScoreUI();
    startMatch();
    gameLoop();
</script>
</body>
