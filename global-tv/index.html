    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            color: #eee;
        }

        /* Header */
        .tv-header {
            background: #0f0f0f;
            padding: 0.8rem 2rem;
            border-bottom: 1px solid #00ffff22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-btn {
            background: #00ffff11;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.3rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .logo-btn:hover {
            background: #00ffff22;
            box-shadow: 0 0 10px #00ffff66;
        }

        .page-title {
            color: #00ffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .stats {
            font-size: 0.7rem;
            color: #ff3366;
        }

        /* Main container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Filters */
        .filters {
            background: #111;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .filter-group {
            background: #1a1a1a;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
        }

        .filter-group label {
            font-size: 0.7rem;
            color: #888;
            margin-right: 0.5rem;
        }

        select, .search-box {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ffff;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-family: monospace;
            cursor: pointer;
        }

        .search-box {
            width: 200px;
        }

        /* Channel grid */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .channel-card {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .channel-card:hover {
            border-color: #00ffff;
            background: #151515;
            transform: translateY(-3px);
        }

        .channel-logo {
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .channel-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-weight: bold;
            color: #00ffff;
            font-size: 1rem;
        }

        .channel-country {
            font-size: 0.7rem;
            color: #888;
            margin-top: 0.2rem;
        }

        .channel-category {
            font-size: 0.65rem;
            color: #ff3366;
            margin-top: 0.2rem;
        }

        /* Player modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .player-container {
            width: 90%;
            max-width: 1200px;
            background: #0a0a0a;
            border-radius: 20px;
            border: 1px solid #00ffff;
            overflow: hidden;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .player-channel-name {
            color: #00ffff;
            font-weight: bold;
        }

        .close-btn {
            background: #ff3366;
            border: none;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .iframe-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #00ffff;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #888;
        }

        @media (max-width: 700px) {
            .filters { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .channels-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="tv-header">
    <a href="https://web-maker-designer.github.io" class="logo-btn">
        📺 WEB MAKER
    </a>
    <div class="page-title">
        🌍 GLOBAL TV — FREE LIVE WORLD TV
    </div>
    <div class="stats" id="stats">Loading channels...</div>
</div>

<div class="main-container">
    <div class="filters">
        <div class="filter-group">
            <label>🌍 Country</label>
            <select id="countryFilter">
                <option value="all">All Countries</option>
            </select>
        </div>
        <div class="filter-group">
            <label>📺 Category</label>
            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🔍 Search</label>
            <input type="text" id="searchInput" class="search-box" placeholder="Channel name...">
        </div>
    </div>

    <div id="channelsGrid" class="channels-grid">
        <div class="loading">📡 Loading channels from IPTV-org API...</div>
    </div>
</div>

<!-- Player Modal -->
<div id="playerModal" class="modal">
    <div class="player-container">
        <div class="player-header">
            <span class="player-channel-name" id="modalChannelName">Channel Name</span>
            <button class="close-btn" onclick="closeModal()">✕ Close</button>
        </div>
        <div class="iframe-container">
            <iframe id="streamIframe" src="about:blank" allowfullscreen></iframe>
        </div>
        <div style="padding:0.8rem; font-size:0.7rem; color:#666; text-align:center;">
            ⚡ Streams provided by IPTV-org | Some streams may require external players
        </div>
    </div>
</div>

<script>
    // API endpoints
    const API_BASE = 'https://iptv-org.github.io/api';
    let allChannels = [];
    let countriesMap = new Map();
    let categoriesSet = new Set();

    // DOM elements
    const channelsGrid = document.getElementById('channelsGrid');
    const countryFilter = document.getElementById('countryFilter');
    const categoryFilter = document.getElementById('categoryFilter');
    const searchInput = document.getElementById('searchInput');
    const statsSpan = document.getElementById('stats');

    // Fetch channels
    async function fetchChannels() {
        try {
            const response = await fetch(`${API_BASE}/channels.json`);
            allChannels = await response.json();
            
            // Fetch countries for mapping
            const countriesRes = await fetch(`${API_BASE}/countries.json`);
            const countries = await countriesRes.json();
            countries.forEach(c => countriesMap.set(c.code, c.name));
            
            // Build unique categories
            allChannels.forEach(ch => {
                if (ch.categories) {
                    ch.categories.forEach(cat => categoriesSet.add(cat));
                }
            });
            
            populateFilters();
            renderChannels();
            statsSpan.innerText = `📡 ${allChannels.length} channels`;
        } catch (error) {
            console.error('Error fetching channels:', error);
            channelsGrid.innerHTML = '<div class="no-results">❌ Error loading channels. Please refresh.</div>';
            statsSpan.innerText = '⚠️ Error loading';
        }
    }
    
    function populateFilters() {
        // Country dropdown
        const countries = new Map();
        allChannels.forEach(ch => {
            if (ch.country && !countries.has(ch.country)) {
                const countryName = countriesMap.get(ch.country) || ch.country;
                countries.set(ch.country, countryName);
            }
        });
        const sortedCountries = Array.from(countries.entries()).sort((a,b) => a[1].localeCompare(b[1]));
        sortedCountries.forEach(([code, name]) => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = `${getFlagEmoji(code)} ${name}`;
            countryFilter.appendChild(option);
        });
        
        // Category dropdown
        const sortedCategories = Array.from(categoriesSet).sort();
        sortedCategories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
            categoryFilter.appendChild(option);
        });
    }
    
    function getFlagEmoji(countryCode) {
        const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }
    
    function renderChannels() {
        const country = countryFilter.value;
        const category = categoryFilter.value;
        const search = searchInput.value.toLowerCase();
        
        let filtered = allChannels.filter(ch => {
            if (country !== 'all' && ch.country !== country) return false;
            if (category !== 'all' && (!ch.categories || !ch.categories.includes(category))) return false;
            if (search && !ch.name.toLowerCase().includes(search)) return false;
            return true;
        });
        
        // Limit to 200 for performance
        filtered = filtered.slice(0, 200);
        
        if (filtered.length === 0) {
            channelsGrid.innerHTML = '<div class="no-results">📺 No channels found. Try different filters.</div>';
            statsSpan.innerText = `0 channels`;
            return;
        }
        
        statsSpan.innerText = `📺 ${filtered.length} channels`;
        
        channelsGrid.innerHTML = filtered.map(ch => {
            const countryName = countriesMap.get(ch.country) || ch.country;
            const flag = getFlagEmoji(ch.country || '');
            const categoriesDisplay = ch.categories ? ch.categories.slice(0,2).join(', ') : '';
            const logoUrl = `https://iptv-org.github.io/api/logos/${ch.id}.png`;
            
            return `
                <div class="channel-card" onclick="playChannel('${ch.id}', '${ch.name.replace(/'/g, "\\'")}', '${countryName}')">
                    <div class="channel-logo">
                        <img src="${logoUrl}" onerror="this.style.display='none'; this.parentElement.innerHTML='📺'" alt="logo">
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-country">${flag} ${countryName}</div>
                        <div class="channel-category">${categoriesDisplay || 'General'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // Get stream URL for channel
    async function getStreamUrl(channelId) {
        try {
            const response = await fetch(`${API_BASE}/streams.json`);
            const streams = await response.json();
            const stream = streams.find(s => s.channel === channelId);
            return stream ? stream.url : null;
        } catch (e) {
            console.error('Stream fetch error:', e);
            return null;
        }
    }
    
    async function playChannel(channelId, channelName, countryName) {
        const modal = document.getElementById('playerModal');
        const modalTitle = document.getElementById('modalChannelName');
        const iframe = document.getElementById('streamIframe');
        
        modalTitle.innerText = `${channelName} (${countryName})`;
        iframe.src = 'about:blank';
        modal.classList.add('active');
        
        // Show loading in iframe area
        const container = document.querySelector('.iframe-container');
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.innerText = '🔍 Finding stream URL...';
        loadingDiv.style.position = 'absolute';
        loadingDiv.style.top = '50%';
        loadingDiv.style.left = '50%';
        loadingDiv.style.transform = 'translate(-50%, -50%)';
        loadingDiv.style.zIndex = '10';
        container.appendChild(loadingDiv);
        
        const streamUrl = await getStreamUrl(channelId);
        
        if (streamUrl) {
            // Many streams require a specific embed approach or external player
            // For now, try to load in iframe - note: many streams are .m3u8 which won't play directly in iframe
            iframe.src = streamUrl;
            loadingDiv.innerText = '🎬 Loading stream... (may require external player for .m3u8)';
            setTimeout(() => loadingDiv.remove(), 3000);
        } else {
            loadingDiv.innerText = '❌ No stream URL found. Check channel on IPTV-org.';
            setTimeout(() => loadingDiv.remove(), 3000);
        }
    }
    
    function closeModal() {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('streamIframe');
        iframe.src = 'about:blank';
        modal.classList.remove('active');
    }
    
    // Event listeners
    countryFilter.addEventListener('change', renderChannels);
    categoryFilter.addEventListener('change', renderChannels);
    searchInput.addEventListener('input', renderChannels);
    
    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    
    // Initialize
    fetchChannels();
</script>
</body>
</html>
